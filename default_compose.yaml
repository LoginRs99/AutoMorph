services:
  automorph:
    image: ghcr.io/holjab/automorph:latest
    container_name: automorph
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TAILSCALE_FUNNEL_URL=${TAILSCALE_FUNNEL_URL:-}
      - BASE_URL=${BASE_URL:-}
      - GITHUB_RELEASE_REPO=${GITHUB_RELEASE_REPO:-}
      - GITHUB_RELEASE_TOKEN=${GITHUB_RELEASE_TOKEN:-}
      - GITHUB_RELEASE_KEEP=${GITHUB_RELEASE_KEEP:-2}
      - GITHUB_RELEASE_PUBLISH_CONFIG=${GITHUB_RELEASE_PUBLISH_CONFIG:-true}
      - GITHUB_RELEASE_EXCLUDE=${GITHUB_RELEASE_EXCLUDE:-}
      - APPRISE_URL=${APPRISE_URL:-}
      - APPRISE_NOTIFY_ON_FAILURE=${APPRISE_NOTIFY_ON_FAILURE:-true}
      - GITHUB_RELEASE_UPDATE_README=${GITHUB_RELEASE_UPDATE_README:-true}
      - ALLOW_CERT_CHANGE=${ALLOW_CERT_CHANGE:-false}
    env_file:
      - .env
    volumes:
      - ./apps:/automorph/apps:rw
      - ./tools/morphe-data:/automorph/tools/morphe-data:rw
      - ./tools/automorph-data:/automorph/tools/automorph-data:rw

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare_tunnel
    restart: unless-stopped
    profiles: ["cloudflare"]
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

  pangolin:
    image: fosrl/newt:latest
    container_name: pangolin_newt
    restart: unless-stopped
    profiles: ["pangolin"]
    environment:
      - PANGOLIN_ENDPOINT=${PANGOLIN_ENDPOINT}
      - NEWT_ID=${PANGOLIN_ID}
      - NEWT_SECRET=${PANGOLIN_SECRET}